name: Temporary Dayton Mobile Roadmap Fix

on:
  push:
    branches:
      - agent/dayton-refinement-2026-08-19

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/dayton-refinement-2026-08-19
          fetch-depth: 0

      - name: Apply bounded roadmap positioning correction
        run: python3 scripts/fix-mobile-roadmap.py

      - name: Commit correction
        run: |
          if git diff --quiet -- index.html; then
            echo 'No roadmap correction required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Correct mobile roadmap state positioning [mobile-fix]'
          git push origin HEAD:agent/dayton-refinement-2026-08-19
