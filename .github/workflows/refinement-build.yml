name: Temporary Dayton Refinement Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Check out audited branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/dayton-refinement-2026-08-19
          fetch-depth: 0

      - name: Validate source and production artifact
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          HTMLParser().feed(html)
          assert 'cdn.tailwindcss.com' not in html
          assert 'chart.js@4.5.1/dist/chart.umd.min.js' in html
          assert 'lucide@1.28.0' in html
          assert html.count('preload="metadata"') == 6
          assert 'class="skip-link"' in html
          assert 'prefers-reduced-motion' in Path('refinement.css').read_text(encoding='utf-8')
          assert 'tailwindcss v3.4.17' in Path('tailwind.css').read_text(encoding='utf-8')
          for name in [
              'Monetizing_a_Commercial_Kitchen_Coworking_Blueprint.mp3',
              'Monetizing_a_Commercial_Kitchen_Coworking_Blueprint.mp4',
              'North Star Commissary - Bankable CoWorking Model.mp3',
              'North Star Commissary - Bankable CoWorking Model.mp4',
              'North Star Commissary - Food Coworking Model.mp3',
              'North Star Commissary - Food Coworking Model.mp4',
          ]:
              p = Path(name)
              assert p.is_file() and p.stat().st_size > 1_000_000, name
          assert not Path('0022-from-the-hip-photo-1_orig.jpg').exists()
          assert not Path('pirate-chef-final-trans-color-rgb-hr.png').exists()
          print('Source/artifact validation: pass')
          PY
          node --check refinement.js

      - name: Install matching Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.1

      - name: Run responsive interaction and accessibility smoke
        run: |
          mkdir -p qa
          python3 -m http.server 4173 > /tmp/dayton-http.log 2>&1 &
          echo $! > /tmp/dayton-http.pid
          cat > /tmp/dayton-validate.mjs <<'JS'
          import { chromium, firefox, webkit } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const baseURL = 'http://127.0.0.1:4173/';
          const knownMissing = ['0022-from-the-hip-photo-1_orig.jpg', 'pirate-chef-final-trans-color-rgb-hr.png'];
          const mediaPattern = /\.(mp3|mp4)(?:\?|$)/i;
          const engines = { chromium, firefox, webkit };
          const viewportSets = {
            chromium: [
              { name: 'small-mobile', width: 375, height: 812, touch: true },
              { name: 'large-mobile', width: 430, height: 932, touch: true },
              { name: 'tablet', width: 768, height: 1024, touch: true },
              { name: 'desktop', width: 1440, height: 900, touch: false },
            ],
            firefox: [
              { name: 'mobile', width: 430, height: 932, touch: false },
              { name: 'desktop', width: 1440, height: 900, touch: false },
            ],
            webkit: [
              { name: 'mobile', width: 430, height: 932, touch: true },
              { name: 'desktop', width: 1440, height: 900, touch: false },
            ],
          };
          const results = [];
          const knownMissingURL = url => knownMissing.some(name => url.includes(name));

          async function validatePage(engineName, browserType, vp) {
            const browser = await browserType.launch();
            const context = await browser.newContext({ viewport: { width: vp.width, height: vp.height }, hasTouch: vp.touch });
            const page = await context.newPage();
            const pageErrors = [];
            const failedRequests = [];
            const consoleErrors = [];
            await page.route(mediaPattern, route => route.abort('blockedbyclient'));
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('requestfailed', req => {
              const url = req.url();
              if (!mediaPattern.test(url) && !knownMissingURL(url)) failedRequests.push(`${url} ${req.failure()?.errorText || ''}`.trim());
            });
            page.on('console', msg => {
              if (msg.type() !== 'error') return;
              const url = msg.location()?.url || '';
              if (!knownMissingURL(url)) consoleErrors.push(`${url} ${msg.text()}`.trim());
            });

            const response = await page.goto(baseURL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            assert.equal(response?.status(), 200, `${engineName}/${vp.name}: page status`);
            await page.waitForFunction(() => typeof window.switchTab === 'function' && typeof window.Chart !== 'undefined' && typeof window.lucide !== 'undefined', null, { timeout: 30000 });
            await page.waitForTimeout(300);
            assert.equal(await page.locator('video[preload="metadata"]').count(), 3);
            assert.equal(await page.locator('audio[preload="metadata"]').count(), 3);
            assert.equal(await page.locator('#nav-bridge').getAttribute('aria-current'), 'page');
            assert.equal(await page.locator('.skip-link').count(), 1);

            const overflow = await page.evaluate(() => ({ root: document.documentElement.scrollWidth - document.documentElement.clientWidth, body: document.body.scrollWidth - document.body.clientWidth }));
            assert.ok(overflow.root <= 1 && overflow.body <= 1, `${engineName}/${vp.name}: horizontal overflow ${JSON.stringify(overflow)}`);

            if (vp.width < 768) {
              const menu = page.locator('#mobileMenuBtn');
              await menu.focus();
              assert.equal(await menu.getAttribute('aria-expanded'), 'false');
              await menu.click();
              assert.equal(await menu.getAttribute('aria-expanded'), 'true');
              assert.equal(await page.evaluate(() => document.activeElement?.id), 'mobileMenuClose');
              await page.keyboard.press('Escape');
              assert.equal(await menu.getAttribute('aria-expanded'), 'false');
              assert.equal(await page.evaluate(() => document.activeElement?.id), 'mobileMenuBtn');
            }

            const source = page.locator('.source-badge').first();
            await source.focus();
            await page.keyboard.press('Enter');
            assert.equal(await source.getAttribute('aria-expanded'), 'true');
            await page.keyboard.press('Escape');
            assert.equal(await source.getAttribute('aria-expanded'), 'false');

            await page.evaluate(() => window.switchTab('ecosystem'));
            assert.equal(await page.locator('#nav-ecosystem').getAttribute('aria-current'), 'page');
            const zone = page.locator('.blueprint-zone').first();
            await zone.focus();
            await page.keyboard.press('Enter');
            assert.equal(await zone.getAttribute('aria-expanded'), 'true');
            await page.keyboard.press('Escape');
            assert.equal(await zone.getAttribute('aria-expanded'), 'false');

            await page.evaluate(() => window.switchTab('financials'));
            const slider = page.locator('#delay-slider');
            await slider.focus();
            const before = await slider.getAttribute('aria-valuetext');
            await page.keyboard.press('ArrowRight');
            await page.waitForTimeout(75);
            const after = await slider.getAttribute('aria-valuetext');
            assert.notEqual(before, after);
            assert.match(after || '', /months, total cash burn/);

            await page.evaluate(() => window.switchTab('radar'));
            const layer = page.locator('.funnel-layer').first();
            await layer.focus();
            await page.keyboard.press('Enter');
            assert.equal(await layer.getAttribute('aria-pressed'), 'true');
            assert.match((await page.locator('#funnel-title').textContent()) || '', /Critical Path/);
            assert.equal(await page.locator('#funnel-list').getAttribute('aria-live'), 'polite');

            await page.evaluate(() => window.switchTab('roadmap'));
            assert.equal(await page.locator('#nav-roadmap').getAttribute('aria-current'), 'page');
            await page.screenshot({ path: `qa/${engineName}-${vp.name}.png`, fullPage: false });
            assert.deepEqual(pageErrors, [], `${engineName}/${vp.name}: page errors`);
            assert.deepEqual(failedRequests, [], `${engineName}/${vp.name}: failed requests`);
            assert.deepEqual(consoleErrors, [], `${engineName}/${vp.name}: console errors`);
            results.push({ engine: engineName, viewport: vp.name, overflow, status: 'pass' });
            await context.close();
            await browser.close();
          }

          for (const [engineName, browserType] of Object.entries(engines)) {
            for (const vp of viewportSets[engineName]) await validatePage(engineName, browserType, vp);
          }

          const reducedBrowser = await chromium.launch();
          const reducedContext = await reducedBrowser.newContext({ viewport: { width: 430, height: 932 }, reducedMotion: 'reduce' });
          const reducedPage = await reducedContext.newPage();
          await reducedPage.route(mediaPattern, route => route.abort('blockedbyclient'));
          await reducedPage.goto(baseURL, { waitUntil: 'domcontentloaded' });
          const reduced = await reducedPage.evaluate(() => ({ matches: matchMedia('(prefers-reduced-motion: reduce)').matches, duration: getComputedStyle(document.querySelector('.slide-up')).animationDuration }));
          assert.equal(reduced.matches, true);
          assert.ok(['0s', '0.00001s', '0.01ms'].includes(reduced.duration), `Reduced motion duration: ${reduced.duration}`);
          await reducedPage.screenshot({ path: 'qa/chromium-reduced-motion.png', fullPage: false });
          await reducedContext.close();
          await reducedBrowser.close();

          fs.writeFileSync('qa/results.json', JSON.stringify({ results, reduced }, null, 2));
          console.log(JSON.stringify({ results, reduced }, null, 2));
          JS
          node /tmp/dayton-validate.mjs
          kill $(cat /tmp/dayton-http.pid) || true

      - name: Upload QA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dayton-refinement-qa
          path: qa/
          if-no-files-found: error
          retention-days: 7
