name: Dayton Boundary Orientation Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.1

      - name: Verify live boundaries and orientations
        run: |
          cat > /tmp/boundary.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import assert from 'node:assert/strict';

          const url = 'https://workfolios.github.io/Dayton-Dashboard/';
          const mediaPattern = /\.(mp3|mp4)(?:\?|$)/i;
          const cases = [
            { engine: 'chromium', browser: chromium, name: 'below-md', width: 767, height: 900, mobileNav: true },
            { engine: 'chromium', browser: chromium, name: 'at-md', width: 768, height: 900, mobileNav: false },
            { engine: 'chromium', browser: chromium, name: 'above-md', width: 769, height: 900, mobileNav: false },
            { engine: 'chromium', browser: chromium, name: 'mobile-landscape', width: 932, height: 430, mobileNav: false },
            { engine: 'chromium', browser: chromium, name: 'tablet-landscape', width: 1024, height: 768, mobileNav: false },
            { engine: 'webkit', browser: webkit, name: 'mobile-landscape', width: 932, height: 430, mobileNav: false }
          ];

          for (const c of cases) {
            const browser = await c.browser.launch();
            try {
              const context = await browser.newContext({ viewport: { width: c.width, height: c.height }, hasTouch: c.engine === 'webkit' });
              const page = await context.newPage();
              await page.route(mediaPattern, route => route.abort('blockedbyclient'));
              const response = await page.goto(`${url}?boundary=${c.name}&engine=${c.engine}&t=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              assert.equal(response?.status(), 200);
              await page.waitForFunction(() => typeof window.switchTab === 'function');
              await page.waitForTimeout(600);
              const state = await page.evaluate(() => {
                const header = document.querySelector('body > div.md\\:hidden');
                const sidebar = document.getElementById('sidebar');
                const main = document.getElementById('main-content');
                return {
                  headerDisplay: header ? getComputedStyle(header).display : null,
                  sidebarTransform: sidebar ? getComputedStyle(sidebar).transform : null,
                  sidebarDisplay: sidebar ? getComputedStyle(sidebar).display : null,
                  rootOverflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                  bodyOverflow: document.body.scrollWidth - document.body.clientWidth,
                  mainClientWidth: main?.clientWidth || 0,
                  mainClientHeight: main?.clientHeight || 0
                };
              });
              assert.ok(state.rootOverflow <= 1 && state.bodyOverflow <= 1, `${c.engine}/${c.name}: horizontal overflow ${JSON.stringify(state)}`);
              assert.ok(state.mainClientWidth > 0 && state.mainClientHeight > 0, `${c.engine}/${c.name}: main content collapsed`);
              if (c.mobileNav) {
                assert.notEqual(state.headerDisplay, 'none', `${c.engine}/${c.name}: mobile header should be visible`);
              } else {
                assert.equal(state.headerDisplay, 'none', `${c.engine}/${c.name}: mobile header should be hidden`);
              }
              await page.evaluate(() => window.switchTab('roadmap'));
              await page.waitForTimeout(900);
              assert.equal(await page.locator('#nav-roadmap').getAttribute('aria-current'), 'page');
              const heading = page.locator('#tab-roadmap h2').first();
              assert.equal(await heading.isVisible(), true, `${c.engine}/${c.name}: roadmap heading not visible`);
              console.log(JSON.stringify({ engine: c.engine, case: c.name, width: c.width, height: c.height, state, status: 'pass' }));
              await context.close();
            } finally {
              await browser.close();
            }
          }
          JS
          HOME=/root node /tmp/boundary.mjs
